name: Release APK

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extract version
        id: ver
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup secrets
        if: steps.check.outputs.skip == 'false'
        run: cp secrets.defaults.properties secrets.properties

      # Without this, Gradle falls back to the plain Android debug keystore (its own
      # build.gradle.kts fallback for a missing keystore.properties) and every release built
      # here is signed with a different key than Joe's own local sideload builds — Android then
      # refuses to install it as an update ("signature conflict", confirmed live 2026-09-14 on
      # the office device). Files only exist in this ephemeral runner workspace, never committed.
      - name: Setup signing
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # The staging build (R8-optimised, not debuggable): about half the size of debug and
      # noticeably smoother on the Onn boxes, and the build Joe installs (2026-10-05).
      - name: Build APKs
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew :app:assembleSideloadStaging :musicapp:assembleRelease --no-daemon

      - name: Locate and rename APKs
        if: steps.check.outputs.skip == 'false'
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/sideload/staging -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/sideload/staging/xadarr-${{ steps.ver.outputs.name }}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          MSRC=$(find musicapp/build/outputs/apk/release -name "*.apk" | head -1)
          MDEST="musicapp/build/outputs/apk/release/xadarr-music.apk"
          mv "$MSRC" "$MDEST"
          echo "music=$MDEST" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        if: steps.check.outputs.skip == 'false'
        run: |
          awk "/\[${{ steps.ver.outputs.name }}\]/{found=1; next} found && /^## \[/{exit} found" \
            CHANGELOG.md > release_notes.md

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Xadarr ${{ steps.ver.outputs.name }}" \
            --notes-file release_notes.md \
            "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.music }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
